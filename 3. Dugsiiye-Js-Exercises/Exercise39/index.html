<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise#39</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <form class="form">
            <h1>language translator</h1>
            <label class="label">from:</label>
            <select name="select" class="select-from">
                <option value="option" class="option-from">Select Languages:</option>
            </select>
            <label class="label">to:</label>
            <select name="select" class="select-to">
                <option value="option" class="option">Select Languages:</option>
            </select>

            <p>text to translate :</p>
            <textarea name="textarea" class="textarea"></textarea>
            <button type="submit" class="btn">translate</button>
        </form>
        <div class="display-translated-text">
            <h2>translated text :</h2>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
