<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise#37</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
       
        <div class="blog-container">
             <h2>simple blog</h2>
            <form id="form">
                <h3>create a new post</h3>
                <input id="input-post" type="text" placeholder="post-tittle" required>
                <input id="image-url" type="text" placeholder="Image URL(optional)" required>
                <textarea name="textarea" id="text-area" placeholder="write your post here....." required ></textarea>
                <button type="submit" id="add-post">Add post</button>
            </form>
            <h4>All Posts</h4>
            <div id="all-posts">
               
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
