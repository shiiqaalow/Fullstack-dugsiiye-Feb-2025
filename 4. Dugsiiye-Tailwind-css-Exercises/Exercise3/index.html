<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Exercise#3-tailwind-css</title>
</head>
<body>

    <div class="grid grid-cols-3 gap-5 bg-black p-5 capitalize text-white text-center">
        <!-- top -->
        <div class="top bg-blue-700 px-5 py-20 col-span-2 row-span-2 text-center rounded-3xl">
            <h1>Featured image</h1>
            <span>(spans 2x2) </span>
        </div>
        <!--left -->
        <div class="left bg-green-500 px-5 py-10 rounded-3xl">
            <h1>image 2</h1>
        </div>
        <!--right -->
        <div class="right bg-green-500 px-5 py-10 rounded-3xl">
            <h1>image 3</h1>
        </div>
        <!-- bottoms with same sizes -->
        <div class="bottom-1 bg-purple-600 px-5 py-10  rounded-3xl">
            <h1>image 4</h1>
        </div>
        <div class="bottom-2 bg-purple-600 px-5 py-10  ml-4  rounded-3xl">
            <h1>image 5</h1>
        </div>
        <div class="bottom-3 bg-purple-600 px-5 py-10  ml-4  rounded-3xl">
            <h1>image 6</h1>
        </div>
    </div>
    
</body>
</html>
